<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notice</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #151515;
            font-family: Arial, Helvetica, sans-serif;
        }

        .notice-page {
            width: min(900px, calc(100% - 30px));
            margin: 30px auto 70px;
        }

        /* =========================
           BACK BUTTON
        ========================= */

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            margin-bottom: 22px;
            padding: 9px 15px;

            border: 1px solid #e5e5e5;
            border-radius: 100px;

            background: #ffffff;
            color: #151515;

            font-size: 13px;
            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .back-button:hover {
            background: #f3f3f3;
            transform: translateY(-1px);
        }

        /* =========================
           NOTICE
        ========================= */

        .notice-card {
            background: #ffffff;

            border: 1px solid #e7e7e7;
            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.04);
        }

        .notice-header {
            padding: 30px 30px 24px;
        }

        .notice-artist {
            display: inline-block;

            margin-bottom: 14px;

            color: #777777;

            font-size: 13px;
            font-weight: 600;
        }

        .notice-title {
            margin: 0;

            font-size: 30px;
            line-height: 1.25;
            font-weight: 700;
        }

        .notice-date {
            margin-top: 10px;

            color: #999999;

            font-size: 12px;
        }

        /* =========================
           IMAGE
        ========================= */

        .notice-image {
            display: block;

            width: 100%;
            max-height: 550px;

            object-fit: cover;
        }

        /* =========================
           CONTENT
        ========================= */

        .notice-content {
            padding: 30px;

            color: #444444;

            font-size: 15px;
            line-height: 1.8;

            white-space: pre-wrap;
        }

        /* =========================
           ACTIONS
        ========================= */

        .notice-actions {
            display: flex;
            align-items: center;

            gap: 8px;

            padding: 0 30px 25px;
        }

        .notice-action {
            border: none;
            border-radius: 100px;

            padding: 9px 14px;

            background: #f3f3f3;
            color: #333333;

            font-family: inherit;
            font-size: 13px;

            cursor: pointer;

            transition: background 0.2s ease;
        }

        .notice-action:hover {
            background: #e9e9e9;
        }

        /* =========================
           MORE FROM
        ========================= */

        .more-section {
            margin-top: 28px;
        }

        .more-title {
            margin: 0 0 14px;

            font-size: 18px;
            font-weight: 700;
        }

        .more-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .more-notice {
            display: block;

            padding: 17px 18px;

            border: 1px solid #e7e7e7;
            border-radius: 16px;

            background: #ffffff;

            color: #151515;
            text-decoration: none;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .more-notice:hover {
            background: #f7f7f7;
            transform: translateY(-1px);
        }

        .more-notice-title {
            font-size: 14px;
            font-weight: 600;
        }

        .more-notice-date {
            margin-top: 5px;

            color: #999999;
            font-size: 11px;
        }

        /* =========================
           STATES
        ========================= */

        .loading,
        .error,
        .empty {
            padding: 60px 20px;

            text-align: center;
            color: #888888;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .notice-page {
                width: calc(100% - 20px);
                margin-top: 15px;
            }

            .notice-header {
                padding: 23px 20px 20px;
            }

            .notice-title {
                font-size: 23px;
            }

            .notice-content {
                padding: 22px 20px;
                font-size: 14px;
            }

            .notice-actions {
                padding: 0 20px 20px;
            }

        }

    </style>
</head>


<body>

    <div class="notice-page">

        <button
            class="back-button"
            onclick="goBackToSerashio()"
        >
            ← Back to Serashio
        </button>


        <main id="noticeContainer">

            <div class="loading">
                Loading notice...
            </div>

        </main>


        <section
            id="moreSection"
            class="more-section"
            style="display: none;"
        >

            <h2
                id="moreTitle"
                class="more-title"
            >
                More from this artist
            </h2>

            <div
                id="moreList"
                class="more-list"
            ></div>

        </section>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/notice.js"></script>

</body>

</html>
