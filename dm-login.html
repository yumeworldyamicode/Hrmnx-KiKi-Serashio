<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Serashio — Login</title>

    <style>

        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            color: #151515;
            font-family: "DM Sans", sans-serif;
            padding: 25px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;
            border: 1px solid #e7e7e7;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.04);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-family: inherit;
            font-size: 14px;
            outline: none;
            margin-bottom: 17px;
        }

        input:focus {
            border-color: #151515;
        }

        button {
            width: 100%;
            border: none;
            border-radius: 10px;
            padding: 13px;
            background: #151515;
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        #message {
            margin-top: 18px;
            font-size: 13px;
            line-height: 1.5;
            color: #777;
        }

        .back {
            display: block;
            margin-top: 22px;
            text-align: center;
            color: #777;
            font-size: 13px;
            text-decoration: none;
        }

    </style>

</head>

<body>

    <main class="login-box">

        <h1>Sign in to Serashio</h1>

        <p class="subtitle">
            Sign in to purchase and use artist DM conversations.
        </p>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                id="email"
                type="email"
                required
                autocomplete="email"
            >

            <label for="password">
                Password
            </label>

            <input
                id="password"
                type="password"
                required
                autocomplete="current-password"
            >

            <button
                id="loginButton"
                type="submit"
            >
                Sign in
            </button>

        </form>

        <div id="message"></div>

        <a
            class="back"
            href="index.html"
        >
            ← Back to Serashio
        </a>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/dm-login.js"></script>

</body>

</html>
