<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Artist — Serashio</title>


    <style>

        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            background: #ffffff;

            color: #151515;

            font-family: "DM Sans", sans-serif;

            min-height: 100vh;
        }


        /* =========================================
           PAGE
        ========================================= */

        .artist-page {

            width: 100%;

            max-width: 950px;

            margin: 0 auto;

            padding: 35px 25px 70px;
        }


        /* =========================================
           BANNER
        ========================================= */

        .artist-banner {

            width: 100%;

            height: 260px;

            border-radius: 20px;

            overflow: hidden;

            background: #f1f1f1;

            position: relative;
        }


        .artist-banner img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            display: block;
        }


        .artist-banner-placeholder {

            width: 100%;

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999999;

            font-size: 14px;
        }


        /* =========================================
           ARTIST HEADER
        ========================================= */

        .artist-header {

            position: relative;

            padding-bottom: 30px;

            border-bottom: 1px solid #eeeeee;
        }


        .artist-profile {

            display: flex;

            align-items: flex-end;

            gap: 22px;

            margin-top: -55px;

            padding: 0 25px;

            position: relative;
        }


        .artist-avatar {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            object-fit: cover;

            background: #f1f1f1;

            border: 5px solid #ffffff;

            flex-shrink: 0;

            display: block;
        }


        .artist-avatar-placeholder {

            width: 110px;

            height: 110px;

            border-radius: 50%;

            background: #f1f1f1;

            border: 5px solid #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #999999;

            font-size: 28px;

            flex-shrink: 0;
        }


        .artist-heading {

            padding-bottom: 8px;
        }


        .artist-name {

            font-size: 32px;

            letter-spacing: -1px;

            margin-bottom: 7px;
        }


        .artist-description {

            color: #777777;

            font-size: 14px;

            line-height: 1.6;

            max-width: 650px;

            white-space: pre-line;
        }


        /* =========================================
           BIO
        ========================================= */

        .artist-bio {

            padding: 28px 25px 0;

            font-size: 14px;

            line-height: 1.8;

            color: #444444;

            white-space: pre-line;
        }


        .artist-section-title {

            font-size: 18px;

            margin-bottom: 12px;
        }


        /* =========================================
           FAQ
        ========================================= */

        .artist-faq {

            padding: 35px 25px 0;
        }


        .faq-list {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .faq-item {

            border: 1px solid #e8e8e8;

            border-radius: 14px;

            overflow: hidden;
        }


        .faq-question {

            width: 100%;

            border: none;

            background: #ffffff;

            color: #151515;

            font-family: inherit;

            font-size: 14px;

            font-weight: 600;

            text-align: left;

            padding: 17px 18px;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;
        }


        .faq-question:hover {

            background: #fafafa;
        }


        .faq-arrow {

            color: #999999;

            font-size: 12px;

            transition:
                transform 0.2s ease;
        }


        .faq-item.open .faq-arrow {

            transform: rotate(180deg);
        }


        .faq-answer {

            display: none;

            padding: 0 18px 17px;

            color: #777777;

            font-size: 13px;

            line-height: 1.7;

            white-space: pre-line;
        }


        .faq-item.open .faq-answer {

            display: block;
        }


        /* =========================================
           TABS
        ========================================= */

        .artist-tabs {

            display: flex;

            gap: 25px;

            border-bottom: 1px solid #eeeeee;

            margin-top: 35px;

            margin-bottom: 25px;
        }


        .artist-tab {

            border: none;

            background: none;

            padding: 16px 2px 13px;

            color: #999999;

            font-family: inherit;

            font-size: 13px;

            font-weight: 600;

            cursor: pointer;

            border-bottom: 2px solid transparent;
        }


        .artist-tab:hover {

            color: #555555;
        }


        .artist-tab.active {

            color: #151515;

            border-bottom-color: #151515;
        }


        /* =========================================
           CONTENT
        ========================================= */

        .tab-content {

            min-height: 200px;
        }


        .notice-list {

            display: flex;

            flex-direction: column;

            gap: 15px;
        }


        /* =========================================
           NOTICE
        ========================================= */

        .notice-card {

            display: block;

            text-decoration: none;

            color: #151515;

            border: 1px solid #e8e8e8;

            border-radius: 17px;

            padding: 20px;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .notice-card:hover {

            transform: translateY(-1px);

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.05);
        }


        .notice-date {

            color: #999999;

            font-size: 11px;

            margin-bottom: 7px;
        }


        .notice-title {

            font-size: 17px;

            margin-bottom: 7px;
        }


        .notice-excerpt {

            color: #777777;

            font-size: 13px;

            line-height: 1.6;

            display: -webkit-box;

            -webkit-line-clamp: 2;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        /* =========================================
           MUSIC
        ========================================= */

        .release-list {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 18px;
        }


        .release-card {

            display: block;

            color: #151515;

            text-decoration: none;

            border: 1px solid #e8e8e8;

            border-radius: 17px;

            overflow: hidden;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .release-card:hover {

            transform: translateY(-2px);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.06);
        }


        .release-cover {

            display: block;

            width: 100%;

            aspect-ratio: 1 / 1;

            object-fit: cover;

            background: #f1f1f1;
        }


        .release-info {

            padding: 16px;
        }


        .release-title {

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 5px;
        }


        .release-meta {

            color: #888888;

            font-size: 12px;
        }


        /* =========================================
           STATES
        ========================================= */

        .state {

            padding: 50px 10px;

            text-align: center;

            color: #999999;

            font-size: 14px;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .artist-page {

                padding:
                    25px
                    15px
                    50px;
            }


            .artist-banner {

                height: 190px;

                border-radius: 16px;
            }


            .artist-profile {

                align-items: flex-start;

                flex-direction: column;

                gap: 10px;

                margin-top: -45px;

                padding: 0 15px;
            }


            .artist-avatar,
            .artist-avatar-placeholder {

                width: 90px;

                height: 90px;
            }


            .artist-heading {

                padding-bottom: 0;
            }


            .artist-name {

                font-size: 25px;
            }


            .artist-bio {

                padding:
                    25px
                    15px
                    0;
            }


            .artist-faq {

                padding:
                    30px
                    15px
                    0;
            }


            .artist-tabs {

                margin-top: 30px;
            }


            .release-list {

                grid-template-columns:
                    1fr;
            }

        }

    </style>

</head>


<body>


<main class="artist-page">


    <!-- =========================================
         ARTIST HEADER
    ========================================= -->

    <section
        id="artistHeader"
        class="artist-header"
    >

        <div class="state">
            Loading...
        </div>

    </section>

    <div id="dm-section" style="display:none;">
    <h2>Direct Messages</h2>

    <p>
        Send a private message to this artist.
        A DM purchase includes 20 messages.
    </p>

    <button id="buy-dm-button" type="button">
        Purchase DM — ¥500
    </button>

    <p id="dm-status"></p>
</div>


    <!-- =========================================
         TABS
    ========================================= -->

    <nav class="artist-tabs">

        <button
            id="noticesTab"
            class="artist-tab active"
            type="button"
        >
            Notices
        </button>


        <button
            id="musicTab"
            class="artist-tab"
            type="button"
        >
            Music
        </button>

    </nav>


    <!-- =========================================
         TAB CONTENT
    ========================================= -->

    <section
        id="tabContent"
        class="tab-content"
    >

        <div class="state">
            Loading...
        </div>

    </section>


</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/artist.js"></script>


</body>

</html>
