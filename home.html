<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HOME</title>


    <style>

        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap');


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #ffffff;
            color: #151515;

            font-family: "DM Sans", sans-serif;

            min-height: 100vh;
        }


        /* =========================
           HEADER
        ========================= */

        .serashio-header {

            width: 100%;

            padding: 28px 45px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            border-bottom: 1px solid #eeeeee;
        }


        .serashio-brand {

            display: flex;
            align-items: center;

            gap: 12px;
        }


        .serashio-logo {

            font-size: 30px;

            font-weight: 700;

            letter-spacing: -1px;
        }


        .serashio-subtitle {

            color: #888888;

            font-size: 13px;
        }


        /* =========================
           ARTIST FILTER
        ========================= */

        .artist-navigation {

            display: flex;

            gap: 8px;

            padding: 14px 45px;

            border-bottom: 1px solid #eeeeee;

            overflow-x: auto;
        }


        .artist-button {

            border: none;

            background: #f5f5f5;

            color: #555555;

            border-radius: 100px;

            padding: 9px 16px;

            font-size: 13px;

            cursor: pointer;

            white-space: nowrap;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }


        .artist-button:hover {

            background: #ededed;

            transform: translateY(-1px);
        }


        .artist-button.active {

            background: #151515;

            color: #ffffff;
        }


        /* =========================
           MAIN
        ========================= */

        .serashio-main {

            width: 100%;

            max-width: 950px;

            margin: 0 auto;

            padding: 35px 25px 70px;
        }


        /* =========================
           INTRO
        ========================= */

        .intro {

            margin-bottom: 30px;
        }


        .intro h1 {

            font-size: 34px;

            letter-spacing: -1px;

            margin-bottom: 8px;
        }


        .intro p {

            color: #777777;

            font-size: 15px;

            line-height: 1.6;
        }

        /* =========================
   NOTICE BANNER
========================= */

.notice-banner {

    position: relative;

    width: 100%;

    margin-bottom: 30px;

    border-radius: 20px;

    overflow: hidden;

    background: #f5f5f5;

    aspect-ratio: 2.8 / 1;

    box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.04);
}


.notice-banner-slides {

    position: absolute;

    inset: 0;
}


.notice-banner-slide {

    position: absolute;

    inset: 0;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity 0.5s ease;
}


.notice-banner-slide.active {

    opacity: 1;

    pointer-events: auto;
}


.notice-banner-slide a {

    display: block;

    width: 100%;

    height: 100%;

    color: inherit;

    text-decoration: none;
}


.notice-banner-slide img {

    display: block;

    width: 100%;

    height: 100%;

    object-fit: cover;
}


/* =========================
   BANNER TEXT
========================= */

.notice-banner-content {

    position: absolute;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 45px 35px 35px;

    color: #ffffff;

    background:
        linear-gradient(
            to top,
            rgba(0, 0, 0, 0.65),
            rgba(0, 0, 0, 0)
        );
}


.notice-banner-title {

    font-size: 24px;

    font-weight: 700;

    margin-bottom: 5px;
}


.notice-banner-artist {

    font-size: 13px;

    opacity: 0.9;
}


/* =========================
   BANNER ARROWS
========================= */

.banner-arrow {

    position: absolute;

    top: 50%;

    transform:
        translateY(-50%);

    width: 40px;

    height: 40px;

    border: none;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.9);

    color: #151515;

    font-size: 27px;

    line-height: 1;

    cursor: pointer;

    z-index: 5;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}


.banner-arrow:hover {

    background: #ffffff;

    transform:
        translateY(-50%)
        scale(1.05);
}


.banner-arrow-left {

    left: 15px;
}


.banner-arrow-right {

    right: 15px;
}


/* =========================
   BANNER DOTS
========================= */

.banner-dots {

    position: absolute;

    left: 0;
    right: 0;

    bottom: 15px;

    display: flex;

    justify-content: center;

    gap: 6px;

    z-index: 5;
}


.banner-dot {

    width: 7px;

    height: 7px;

    padding: 0;

    border: none;

    border-radius: 50%;

    background:
        rgba(255, 255, 255, 0.55);

    cursor: pointer;

    transition:
        transform 0.2s ease,
        background 0.2s ease;
}


.banner-dot.active {

    background: #ffffff;

    transform: scale(1.25);
}


        /* =========================
           NOTICE FEED
        ========================= */

        #noticeFeed {

            display: flex;

            flex-direction: column;

            gap: 18px;
        }


        /* =========================
           NOTICE CARD
        ========================= */

        .notice-preview {

            display: block;

            position: relative;

            background: #ffffff;

            border: 1px solid #e7e7e7;

            border-radius: 20px;

            overflow: hidden;

            color: #151515;

            text-decoration: none;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.035);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .notice-preview:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.07);
        }


        /* =========================
           NOTICE IMAGE
        ========================= */

        .notice-preview-image {

            display: block;

            width: 100%;

            max-height: 420px;

            object-fit: cover;
        }


        /* =========================
           NOTICE INFO
        ========================= */

        .notice-preview-body {

            padding: 23px 25px 25px;
        }


        .notice-artist {

            color: #777777;

            font-size: 12px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .notice-title {

            font-size: 22px;

            line-height: 1.3;

            margin-bottom: 8px;
        }


        .notice-date {

            color: #999999;

            font-size: 11px;

            margin-bottom: 13px;
        }


        .notice-excerpt {

            color: #555555;

            font-size: 14px;

            line-height: 1.7;

            white-space: pre-line;

            display: -webkit-box;

            -webkit-line-clamp: 3;

            -webkit-box-orient: vertical;

            overflow: hidden;
        }


        .read-notice {

            display: inline-block;

            margin-top: 17px;

            color: #151515;

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================
           LOADING / ERROR / EMPTY
        ========================= */

        .feed-state {

            padding: 60px 20px;

            text-align: center;

            color: #888888;

            font-size: 14px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .serashio-header {

                padding: 22px 20px 16px;
            }


            .serashio-subtitle {

                display: none;
            }


            .artist-navigation {

                padding-left: 20px;

                padding-right: 20px;
            }


            .serashio-main {

                padding: 25px 15px 50px;
            }


            .intro h1 {

                font-size: 28px;
            }


            .notice-preview {

                border-radius: 16px;
            }


            .notice-preview-body {

                padding: 20px;
            }


            .notice-title {

                font-size: 20px;
            }

            .notice-banner {

    aspect-ratio: 1.7 / 1;

    border-radius: 16px;

    margin-bottom: 25px;
}


.notice-banner-content {

    padding: 35px 20px 25px;
}


.notice-banner-title {

    font-size: 19px;
}


.notice-banner-artist {

    font-size: 12px;
}


.banner-arrow {

    width: 34px;

    height: 34px;

    font-size: 23px;
}


.banner-arrow-left {

    left: 10px;
}


.banner-arrow-right {

    right: 10px;
}

        }

    </style>

</head>


<body>


    <!-- =========================
         HEADER
    ========================= -->

    <header class="serashio-header">

        <div class="serashio-brand">

            <div class="serashio-logo">
                Serashio
            </div>

            <div class="serashio-subtitle">
                Official notices & updates
            </div>

        </div>

    </header>


    <!-- =========================
         ARTIST NAVIGATION
    ========================= -->

    <nav
        id="artistNavigation"
        class="artist-navigation"
    >

        <button
            class="artist-button active"
            data-artist-id="all"
        >
            All
        </button>

    </nav>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="serashio-main">


        <section class="intro">

            <h1>
                Notices
            </h1>

            <p>
                Official announcements, updates and information from Hrmnx Entertainment artists and groups.
            </p>

        </section>

        <!-- =========================
     BANNER SLIDESHOW
========================= -->

<section
    id="noticeBanner"
    class="notice-banner"
    style="display:none;"
>

    <div class="notice-banner-slides" id="noticeBannerSlides"></div>

    <button
        id="bannerPrevious"
        class="banner-arrow banner-arrow-left"
        type="button"
        aria-label="Previous banner"
    >
        ‹
    </button>

    <button
        id="bannerNext"
        class="banner-arrow banner-arrow-right"
        type="button"
        aria-label="Next banner"
    >
        ›
    </button>

    <div
        id="bannerDots"
        class="banner-dots"
    ></div>

</section>

        <section id="noticeFeed">

            <div class="feed-state">
                Loading notices...
            </div>

        </section>


    </main>


    <!-- =========================
         SCRIPTS
    ========================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="js/supabase.js"></script>

    <script src="js/notice-feed.js"></script>


</body>

</html>
